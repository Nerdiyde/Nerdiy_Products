# Settings and modes (Select and Number)
select:
  - platform: template
    name: "ESP Log Level"
    id: esp_log_level_select
    icon: mdi:math-log
    optimistic: true
    restore_value: true
    initial_option: ${logger_default_level}
    options:
      - "NONE"
      - "ERROR"
      - "WARN"
      - "INFO"
      - "DEBUG"
      - "VERBOSE"
      - "VERY_VERBOSE"
    set_action:
      - lambda: |-
          if (x == "NONE") {
            esp_log_level_set("*", ESP_LOG_NONE);
          } else if (x == "ERROR") {
            esp_log_level_set("*", ESP_LOG_ERROR);
          } else if (x == "WARN") {
            esp_log_level_set("*", ESP_LOG_WARN);
          } else if (x == "INFO") {
            esp_log_level_set("*", ESP_LOG_INFO);
          } else if (x == "DEBUG") {
            esp_log_level_set("*", ESP_LOG_DEBUG);
          } else {
            esp_log_level_set("*", ESP_LOG_VERBOSE);
          }
    web_server:
      sorting_group_id: Diagnostic
      sorting_weight: 1

