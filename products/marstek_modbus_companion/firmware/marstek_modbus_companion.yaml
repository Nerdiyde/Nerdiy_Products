sensor:
  - name: "Battery Wifi Signal Strength"
    id: marstek_battery_wifi_signal_strength
    icon: mdi:wifi
    platform: modbus_controller
    modbus_controller_id: mt
    register_type: holding
    address: ${addr_battery_wifi_dbm}
    value_type: U_WORD
    unit_of_measurement: "dBm"
    filters:
      - multiply: -1
    accuracy_decimals: 0   
    web_server:
      sorting_group_id: ConnectionsBattery
      sorting_weight: 7

  - platform: copy # Reports the Battery signal strength in %
    source_id: marstek_battery_wifi_signal_strength
    name: "Battery Wifi Signal"
    id: battery_wifi_signal_proc
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: " %"
    entity_category: diagnostic
    device_class: ""
    icon: mdi:wifi
    web_server:
      sorting_group_id: ConnectionsBattery
      sorting_weight: 6

  - platform: modbus_controller
