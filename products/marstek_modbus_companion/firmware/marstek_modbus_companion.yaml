    icon: mdi:thermometer
    platform: modbus_controller
    modbus_controller_id: mt
    register_type: holding
    address: ${addr_internal_mos2_temp}
    value_type: S_WORD
    unit_of_measurement: "C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    skip_updates: ${skip_updates_low_priority}
    filters:
      - multiply: 0.1
    web_server:
      sorting_group_id: Temperature
      sorting_weight: 21

  - name: "Battery Max. Cell Temperature"
    id: "marstek_max_cell_temperature"
    icon: mdi:thermometer
    platform: modbus_controller
    modbus_controller_id: mt
    register_type: holding
    address: ${addr_max_cell_temp}
    value_type: S_WORD
    unit_of_measurement: "C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    skip_updates: ${skip_updates_low_priority}
    filters:
      - lambda: |-
          // Extract the numeric part of the BMS version (e.g., "V213" -> 213)
          std::string version_str = id(bms_version_text).state;
          unsigned int version_num = 0;
          if (version_str.length() > 1 && version_str[0] == 'V') {
            version_num = std::stoul(version_str.substr(1));
          }
          // Multiply by 0.1 for BMS version < 2.13
          float multiplier = (version_num < 213) ? 0.1f : 1.0f;
          return x * multiplier;
    web_server:
      sorting_group_id: Temperature
      sorting_weight: 22
    
  - name: "Battery Min. Cell Temperature"
    id: "marstek_min_cell_temperature"
    icon: mdi:thermometer
