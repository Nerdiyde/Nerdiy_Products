    name: "Battery WiFi Status"
    modbus_controller_id: mt
    register_type: holding
    address: ${addr_wifi_status}
    raw_encode: NONE
    icon: mdi:wifi-alert
    entity_category: diagnostic
    skip_updates: ${skip_updates_diagnostic_status}
    lambda: |-
      uint16_t int_mode = (data[item->offset] << 8) + data[item->offset+1];
      ESP_LOGD("main","Parsed operation mode int : %d", int_mode);
      std::string mode_str;
      switch (int_mode) {
        case 0:  mode_str = "Disconnected"; break;
        case 1:  mode_str = "Connected"; break;                                                              
      }
      return mode_str;
    web_server:
      sorting_group_id: ConnectionsBattery
      sorting_weight: 20

  - platform: modbus_controller
    id: bt_status
    name: "Battery BT Status"
    modbus_controller_id: mt
    register_type: holding
    address: ${addr_bt_status}
    raw_encode: NONE
    icon: mdi:home-heart
    entity_category: diagnostic
    skip_updates: ${skip_updates_diagnostic_status}
    lambda: |-
      uint16_t int_mode = (data[item->offset] << 8) + data[item->offset+1];
      ESP_LOGD("main","Parsed operation mode int : %d", int_mode);
      std::string mode_str;
      switch (int_mode) {
        case 0:  mode_str = "Off"; break;
        case 1:  mode_str = "Active after boot"; break;    
        case 2:  mode_str = "Connected"; break; 
        case 3:  mode_str = "Active"; break;                                                           
      }
      return mode_str;
    web_server:
      sorting_group_id: ConnectionsBattery
      sorting_weight: 21

