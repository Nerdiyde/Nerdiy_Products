switch:
  - platform: template
    name: "Status LED Manual Control"
    id: manual_led_control
    icon: mdi:led-strip-variant
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - light.turn_on:
          id: status_led
          red: 100%
          green: 100%
          blue: 100%
          brightness: !lambda "return id(led_brightness).state / 100.0;"
    turn_off_action:
      - script.execute: apply_status_led_from_status
    web_server:
      sorting_group_id: Status
      sorting_weight: 29

  - platform: template
    name: "Battery RS485 Control"
    id: marstek_rs485_control_switch
    icon: mdi:connection
    lambda: |-
      return id(marstek_rs485_control_mode).current_option() == "Enable";
    turn_on_action:
      - select.set:
          id: marstek_rs485_control_mode
          option: "Enable"
    turn_off_action:
      - select.set:
          id: marstek_rs485_control_mode
          option: "Disable"
    web_server:
      sorting_group_id: Control
      sorting_weight: 1

  - platform: template
