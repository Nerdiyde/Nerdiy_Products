# Slow Sensor
  - name: "Battery Total Energy"
    id: "marstek_battery_total_energy" # Was marstek_total_energy
    icon: mdi:battery-charging-100
    platform: modbus_controller
    device_class: energy_storage
    state_class: measurement
    modbus_controller_id: mt
    register_type: holding
    address: ${addr_battery_total_energy}
    value_type: U_WORD
    unit_of_measurement: "kWh"
    accuracy_decimals: 3
    filters:
      - multiply: 0.001 # Firmware 148: 0.001 / Firmware 147: 0.01
    skip_updates: ${skip_updates_low_priority}
    web_server:
      sorting_group_id: DC
      sorting_weight: 7

  - platform: template
    name: "Battery Remaining Capacity"
    id: "marstek_battery_remaining_capacity"
    icon: mdi:battery-arrow-down-outline
    unit_of_measurement: "kWh"
    accuracy_decimals: 2
    update_interval: 5s
    lambda: |-
      if (id(marstek_battery_total_energy).has_state() && id(marstek_battery_state_of_charge).has_state()) {
        float total_energy = id(marstek_battery_total_energy).state;
        float soc_percent = id(marstek_battery_state_of_charge).state;
        if (isnan(total_energy) || isnan(soc_percent)) {
          return NAN;
        }
        if (total_energy < 0.0f) {
          total_energy = 0.0f;
        }
        if (soc_percent < 0.0f) {
          soc_percent = 0.0f;
        } else if (soc_percent > 100.0f) {
          soc_percent = 100.0f;
        }
        float remaining = total_energy * (soc_percent / 100.0f);
        return roundf(remaining * 100.0f) / 100.0f;
      }
      return NAN;
    web_server:
      sorting_group_id: DC
      sorting_weight: 6

  - platform: template
    name: "Battery Usable Capacity"
    id: "marstek_battery_usable_capacity"
    icon: mdi:battery-heart-variant
    unit_of_measurement: "kWh"
    accuracy_decimals: 2
    update_interval: 5s
    lambda: |-
      if (id(marstek_battery_remaining_capacity).has_state() &&
          id(marstek_battery_total_energy).has_state()) {
        float stored_energy = id(marstek_battery_remaining_capacity).state;
        float total_energy = id(marstek_battery_total_energy).state;
        float min_soc = id(marstek_min_soc_for_capacity_calc).state;
        if (id(marstek_min_soc_for_capacity_calc).has_state()) {
          min_soc = id(marstek_min_soc_for_capacity_calc).state;
        }
        if (isnan(stored_energy) || isnan(total_energy) || isnan(min_soc)) {
          return NAN;
        }
        if (stored_energy < 0.0f) {
          stored_energy = 0.0f;
        }
        if (total_energy < 0.0f) {
          total_energy = 0.0f;
        }
        if (min_soc < 0.0f) {
          min_soc = 0.0f;
        } else if (min_soc > 100.0f) {
          min_soc = 100.0f;
        }
        float usable_energy = stored_energy - (total_energy * (min_soc / 100.0f));
        if (usable_energy < 0.0f) {
          usable_energy = 0.0f;
        }
        return roundf(usable_energy * 100.0f) / 100.0f;
      }
      return NAN;
    web_server:
      sorting_group_id: DC
      sorting_weight: 6

  - platform: template
    name: "Battery Time To Full Charge"
    id: "marstek_battery_time_to_full_charge"
    icon: mdi:timer-sand
    unit_of_measurement: "h"
    accuracy_decimals: 2
    update_interval: 5s
    lambda: |-
      if (id(marstek_battery_power).has_state() &&
          id(marstek_battery_remaining_capacity).has_state() &&
          id(marstek_battery_total_energy).has_state()) {
        float power_w = id(marstek_battery_power).state;
        float stored_energy = id(marstek_battery_remaining_capacity).state;
        float full_battery_energy = id(marstek_battery_total_energy).state;
        if (power_w > 0.0f) {
          float remaining_energy = full_battery_energy - stored_energy;
          if (remaining_energy < 0.0f) {
            remaining_energy = 0.0f;
          }
          return remaining_energy / (power_w / 1000.0f);
        }
      }
      return 0.0f;
    web_server:
      sorting_group_id: DC
      sorting_weight: 4

  - platform: template
    name: "Battery Time To Minimum SOC"
    id: "marstek_battery_time_to_min_soc"
    icon: mdi:timer-sand
    unit_of_measurement: "h"
    accuracy_decimals: 2
    update_interval: 5s
    lambda: |-
      if (id(marstek_battery_power).has_state() &&
          id(marstek_battery_usable_capacity).has_state()) {
        float power_w = id(marstek_battery_power).state;
        float usable_energy = id(marstek_battery_usable_capacity).state;
        if (power_w < 0.0f) {
          float discharge_power_w = fabsf(power_w);
          if (usable_energy < 0.0f) {
            usable_energy = 0.0f;
          }
          return usable_energy / (discharge_power_w / 1000.0f);
        }
      }
      return 0.0f;
    web_server:
      sorting_group_id: DC
      sorting_weight: 3

