#     Project information: https://www.Nerdiy.de/
#
#     Credits:
#     Parts of this configuration are based on information from:
#     - https://github.com/Superduper1969/MarstekVenus-LilygoRS485
#     - https://github.com/ViperRNMC/marstek_venus_modbus/
#
# +------------------------------------------------------------------------------------------+
# |                      Marstek Modbus Companion - GPIO and Bus Mapping                     |
# +------------------------------------------------------------------------------------------+
#
# This YAML file configures the ESPHome firmware for the Marstek Modbus Companion device, which uses a LilyGo T-CAN485 board to communicate with a Marstek battery/inverter system over RS485. 
# The configuration includes pin assignments, Modbus register addresses, polling intervals, and other settings required for proper operation and integration with Home Assistant.
#
# +------------------------------+                         +------------------------------+
# | LILYGO T-CAN485              |                         | Marstek RJ45 (battery side)  |
# |------------------------------|                         |------------------------------|
# | GPIO22 (UART TX) ------------+------------------------>| Pin 2 = A                    |
# | GPIO21 (UART RX) <-----------+-------------------------| Pin 1 = B                    |
# | GPIO19 (RS485 EN, inv)       |                         | Pin 3 = NC                   |
# | GPIO17 (AutoDir EN, inv)     |                         | Pin 4 = +5V                  |
# | GPIO16 (RS485 5V EN, inv)    |                         | Pin 5 = +5V                  |
# | GND  ------------------------+-------------------------| Pin 6 = NC                   |
# |                              |-------------------------| Pin 7 = GND                  |
# |                              |-------------------------| Pin 8 = GND                  |
# +------------------------------+                         +------------------------------+
#
# +------------------------------+                         +------------------------------+
# | LILYGO T-CAN485              |                         | Optional W5500 Ethernet      |
# |------------------------------|                         |------------------------------|
# | GPIO18 (SPI CLK) ------------+------------------------>| SCLK                         |
# | GPIO33 (SPI MOSI) -----------+------------------------>| MOSI                         |
# | GPIO34 (SPI MISO) <----------+-------------------------| MISO                         |
# | GPIO5  (SPI CS) -------------+------------------------>| CS                           |
# | GPIO35 (ETH INT) <-----------+-------------------------| INT                          |
# | GPIO32 (ETH RST) ------------+------------------------>| RST                          |
# | 3V3 -------------------------+------------------------>| VCC                          |
# | GND -------------------------+-------------------------| GND                          |
# +------------------------------+                         +------------------------------+
#
# Used pins in this firmware:
# - GPIO22 (UART TX), GPIO21 (UART RX)
# - GPIO19 (RS485 EN), GPIO17 (RS485 auto-direction), GPIO16 (RS485 5V enable)
# - GPIO4 (WS2812 status LED)
#
# Free pins in this firmware configuration (not used by this YAML):
# - GPIO0, GPIO2, GPIO5, GPIO12, GPIO13, GPIO14, GPIO15, GPIO18
# - GPIO23, GPIO25, GPIO26, GPIO27, GPIO32, GPIO33, GPIO34, GPIO35, GPIO36, GPIO39
#
# Notes:
# - If communication fails, swap A/B.
# - Use a shared GND between ESP board and battery side.
# - Tune all user-adjustable values in the substitutions block below.
# - This firmware supports two alternative network options:
#   1) Wi-Fi via the active `wifi:` block below.
#   2) Optional W5500 Ethernet via the commented `ethernet:` block below.
# - ESPHome cannot use Wi-Fi and Ethernet simultaneously; enable only one option at a time.
# - T-CAN485 board documentation shows onboard SPI pins on GPIO2/GPIO15/GPIO14/GPIO13.
#   The optional W5500 mapping below is set to the externally reachable header pins
#   GPIO18/GPIO33/GPIO34/GPIO5/GPIO35/GPIO32.
# - GPIO34 and GPIO35 are input-only on ESP32 and are therefore only used for MISO/INT.
# - GPIO12 is intentionally not used for W5500 because it is a boot strapping pin.
# - LED status overview:
#   Color: green  -> Modbus OK and network/API connected
#   Color: blue   -> Network/API disconnected
#   Color: red    -> Modbus error with network/API connected
#   Color: purple -> Modbus and network/API failed
# -----------------------------------------------------------------------------

substitutions:
  # ===== Device / Build ======================================================
  device_name: marstek-modbus-companion # ESPHome node name (must be unique in network)
  friendly_name: Marstek Modbus Companion # Friendly display name in HA / web UI
  esp32_board: esp32dev # ESPHome board target for this hardware
  cpu_frequency: 240MHz # CPU clock of ESP32
  flash_size: 4MB # Flash size used for partitioning/build
  project_name: nerdiy.marstek_modbus_companion # ESPHome project metadata (owner.project)
  firmware_version: "1.0.0" # Firmware version exposed via ESPHome project metadata
  name_add_mac_suffix: "false" # Append MAC suffix to node name (true/false)

  # ===== System / Access =====================================================
  logger_default_level: INFO # Default ESP log level at boot
  debug_update_interval: 10s # Interval for ESPHome debug component updates
  timezone: Europe/Berlin # Local timezone used by SNTP time synchronization
  ntp_server_primary: fritz.box # Primary NTP server
  ntp_server_secondary: 1.pool.ntp.org # Secondary NTP server
  ntp_server_tertiary: 2.pool.ntp.org # Tertiary NTP server
  api_encryption_key: REPLACE_WITH_32_BYTE_BASE64_KEY # HA API encryption key
  ota_password: please_change_me_ota # OTA update password

  # ===== WiFi / Web ==========================================================
  wifi_fallback_ssid: Marstek Modbus Companion AP # AP SSID if normal WiFi fails
  wifi_fallback_password: please_change_me_ap # AP password for fallback hotspot
  webserver_port: "80" # Embedded web server TCP port
  webserver_version: "3" # ESPHome web server version
  webserver_include_internal: "false" # Show/hide internal entities in web UI
  webserver_local: "true" # Restrict web server to local network
  webserver_auth_username: admin # Basic auth username for embedded web server
  webserver_auth_password: admin # Basic auth password for embedded web server

  # ===== Optional W5500 Ethernet (SPI) =====================================
  # Checked against the T-CAN485 board documentation and current pin usage in this YAML.
  # Mapping uses the externally reachable header pins on this board variant.
  # GPIO34 and GPIO35 are input-only, so they are assigned to MISO/INT only.
  # GPIO12 is intentionally avoided because it is a boot strapping pin.
  w5500_clk_pin: GPIO18 # SPI clock for external W5500 module
  w5500_mosi_pin: GPIO33 # SPI MOSI for external W5500 module
  w5500_miso_pin: GPIO34 # SPI MISO for external W5500 module (input-only pin)
  w5500_cs_pin: GPIO5 # Chip-select for external W5500 module
  w5500_interrupt_pin: GPIO35 # Interrupt line from W5500 module (input-only pin)
  w5500_reset_pin: GPIO32 # Reset line for W5500 module
  w5500_clock_speed: 8MHz # Conservative speed for external wiring reliability

  # ===== RS485 Hardware Pins =================================================
  rs485_enable_pin: GPIO19 # RS485 transceiver enable pin
  rs485_enable_inverted: "true" # Invert logic of RS485 enable pin
  rs485_autodir_pin: GPIO17 # RS485 auto-direction control pin
  rs485_autodir_inverted: "true" # Invert logic of auto-direction pin
  rs485_5v_enable_pin: GPIO16 # 5V power-enable pin for RS485 section
  rs485_5v_enable_inverted: "true" # Invert logic of RS485 5V enable pin

  # ===== UART / Modbus Transport ============================================
  uart_rx_pin: GPIO21 # UART RX from RS485 transceiver
  uart_tx_pin: GPIO22 # UART TX to RS485 transceiver
  uart_baud_rate: "115200" # UART baud rate for Modbus RTU
  uart_data_bits: "8" # UART data bits
  uart_stop_bits: "1" # UART stop bits
  uart_parity: NONE # UART parity mode
  modbus_send_wait_time: 30ms # Pause after Modbus frame send
  modbus_address: "0x1" # Modbus slave address of battery/inverter
  modbus_command_throttle: 30ms # Delay between Modbus commands
  modbus_update_interval: 5s # Default polling interval for controller

  # ===== Polling / Skip Updates =============================================
  # ESPHome polling cadence for modbus_controller entities:
  # effective_poll_interval = (skip_updates + 1) * modbus_update_interval
  # Keep per-entity polling classes centralized for easier tuning.
  skip_updates_fast_control: 2 # Fast-changing/control entities (currently 15s at 5s base)
  skip_updates_cell_voltage: 10 # Cell voltage entities (currently 55s at 5s base)
  skip_updates_diagnostic_status: 20 # Status/diagnostic entities (currently 105s at 5s base)
  skip_updates_low_priority: 60 # Low-priority entities (currently 305s at 5s base)
  skip_updates_optional_registers: 720 # Optional/firmware-dependent registers (currently ~60 minutes)
  default_min_soc_for_capacity_calc: 15 # Used for usable-capacity math on e_v3 where 44001 is unavailable

  # ===== Modbus Register Addresses ==========================================
  addr_device_name: 31000 # Device name (string registers)
  addr_wifi_status: 30300 # WiFi connection status enum
  addr_bt_status: 30301 # Bluetooth status enum
  addr_cloud_status: 30302 # Cloud connection status enum
  addr_alarm_1: 36000 # Alarm bitfield block 1
  addr_alarm_2: 36001 # Alarm bitfield block 2
  addr_grid_alarm: 36100 # Grid-related alarm bitfield
  addr_battery_alarm: 36101 # Battery/BMS-related alarm bitfield
  addr_battery_wifi_dbm: 30303 # Battery WiFi RSSI in dBm
  addr_inverter_state: 35100 # Inverter operating state
  addr_bms_version: 30204 # BMS version number
  addr_vms_version: 30202 # VMS version number
  addr_ems_version: 30200 # EMS version number
  addr_comm_module_firmware: 30350 # Communication module firmware (string)
  addr_mac_address: 30304 # MAC address (string)
  addr_battery_voltage_avg: 32100 # Battery average voltage
  addr_battery_current_avg: 32101 # Battery average current
  addr_battery_voltage: 30100 # Battery voltage (direct)
  addr_battery_current: 30101 # Battery current (direct)
  addr_battery_power: 30001 # Battery power (signed)
  addr_battery_soc: 34002 # Battery state of charge
  addr_battery_total_energy: 32105 # Battery nominal/total energy
  addr_ac_voltage: 32200 # AC output/input voltage
  addr_ac_current: 37004 # AC current
  addr_ac_power: 30006 # AC power (signed)
  addr_ac_frequency: 32204 # AC frequency
  addr_ac_offgrid_voltage: 32300 # AC off-grid voltage
  addr_ac_offgrid_current: 32301 # AC off-grid current
  addr_ac_offgrid_power: 32302 # AC off-grid power
  addr_total_charging_energy: 33000 # Lifetime charged energy
  addr_total_discharging_energy: 33002 # Lifetime discharged energy
  addr_daily_charging_energy: 33004 # Charged energy today
  addr_daily_discharging_energy: 33006 # Discharged energy today
  addr_monthly_charging_energy: 33008 # Charged energy this month
  addr_monthly_discharging_energy: 33010 # Discharged energy this month
  addr_battery_cycle_count: 34003 # Battery cycle count
  addr_modbus_address_register: 41100 # Modbus address register
  addr_internal_temp: 35000 # Internal temperature sensor
  addr_internal_mos1_temp: 35001 # MOSFET temperature sensor 1
  addr_internal_mos2_temp: 35002 # MOSFET temperature sensor 2
  addr_max_cell_temp: 35010 # Maximum cell temperature
  addr_min_cell_temp: 35011 # Minimum cell temperature
  addr_charge_voltage_limit: 35110 # Charge voltage limit
  addr_charge_current_limit: 35111 # Charge current limit
  addr_discharge_current_limit: 35112 # Discharge current limit
  addr_max_cell_voltage: 37007 # Highest measured cell voltage
  addr_min_cell_voltage: 37008 # Lowest measured cell voltage
  addr_cell_1_voltage: 34018 # Cell 1 voltage
  addr_cell_2_voltage: 34019 # Cell 2 voltage
  addr_cell_3_voltage: 34020 # Cell 3 voltage
  addr_cell_4_voltage: 34021 # Cell 4 voltage
  addr_cell_5_voltage: 34022 # Cell 5 voltage
  addr_cell_6_voltage: 34023 # Cell 6 voltage
  addr_cell_7_voltage: 34024 # Cell 7 voltage
  addr_cell_8_voltage: 34025 # Cell 8 voltage
  addr_cell_9_voltage: 34026 # Cell 9 voltage
  addr_cell_10_voltage: 34027 # Cell 10 voltage
  addr_cell_11_voltage: 34028 # Cell 11 voltage
  addr_cell_12_voltage: 34029 # Cell 12 voltage
  addr_cell_13_voltage: 34030 # Cell 13 voltage
  addr_cell_14_voltage: 34031 # Cell 14 voltage
  addr_cell_15_voltage: 34032 # Cell 15 voltage
  addr_cell_16_voltage: 34033 # Cell 16 voltage
  addr_control_mode: 42000 # RS485 control mode setting
  addr_forcible_charge_discharge: 42010 # Force charge/discharge command
  addr_backup_function: 41200 # Backup mode setting
  addr_user_work_mode: 43000 # User work mode selection
  addr_forcible_charge_power: 42020 # Forced charge power setpoint
  addr_charge_to_soc: 42011 # Target SOC for force charge
  addr_forcible_discharge_power: 42021 # Forced discharge power setpoint
  addr_max_charge_power: 44002 # Maximum allowed charge power
  addr_max_discharge_power: 44003 # Maximum allowed discharge power
  addr_reset_device: 41000 # Trigger device reset
  addr_factory_reset: 41001 # Trigger factory reset
  addr_schedule_1_days: 43100 # Schedule 1 days bitmask
  addr_schedule_2_days: 43105 # Schedule 2 days bitmask
  addr_schedule_3_days: 43110 # Schedule 3 days bitmask
  addr_schedule_4_days: 43115 # Schedule 4 days bitmask
  addr_schedule_5_days: 43120 # Schedule 5 days bitmask
  addr_schedule_6_days: 43125 # Schedule 6 days bitmask
  addr_schedule_1_start: 43101 # Schedule 1 start time
  addr_schedule_2_start: 43106 # Schedule 2 start time
  addr_schedule_3_start: 43111 # Schedule 3 start time
  addr_schedule_4_start: 43116 # Schedule 4 start time
  addr_schedule_5_start: 43121 # Schedule 5 start time
  addr_schedule_6_start: 43126 # Schedule 6 start time
  addr_schedule_1_end: 43102 # Schedule 1 end time
  addr_schedule_2_end: 43107 # Schedule 2 end time
  addr_schedule_3_end: 43112 # Schedule 3 end time
  addr_schedule_4_end: 43117 # Schedule 4 end time
  addr_schedule_5_end: 43122 # Schedule 5 end time
  addr_schedule_6_end: 43127 # Schedule 6 end time
  addr_schedule_1_mode: 43103 # Schedule 1 power setpoint
  addr_schedule_2_mode: 43108 # Schedule 2 power setpoint
  addr_schedule_3_mode: 43113 # Schedule 3 power setpoint
  addr_schedule_4_mode: 43118 # Schedule 4 power setpoint
  addr_schedule_5_mode: 43123 # Schedule 5 power setpoint
  addr_schedule_6_mode: 43128 # Schedule 6 power setpoint
  addr_schedule_1_enabled: 43104 # Schedule 1 enabled flag
  addr_schedule_2_enabled: 43109 # Schedule 2 enabled flag
  addr_schedule_3_enabled: 43114 # Schedule 3 enabled flag
  addr_schedule_4_enabled: 43119 # Schedule 4 enabled flag
  addr_schedule_5_enabled: 43124 # Schedule 5 enabled flag
  addr_schedule_6_enabled: 43129 # Schedule 6 enabled flag

  # ===== Status LED / Health Logic ==========================================
  status_led_pin: GPIO4 # WS2812 data pin
  status_led_num_leds: "1" # Number of LEDs in strip
  status_led_name: Status LED # Entity name in UI
  status_led_rgb_order: GRB # RGB byte order for LED chipset
  status_led_chipset: WS2812 # LED chipset type
  status_check_interval: 5s # Interval for status LED evaluation
  wifi_signal_good_threshold: "-80" # dBm threshold for good WiFi state

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2024.11.0
  project:
    name: ${project_name}
    version: ${firmware_version}
  name_add_mac_suffix: ${name_add_mac_suffix}
  on_boot:
    priority: -10
    then:
      - lambda: |-
          // Keep charge target default until first device value arrives.
          id(marstek_charge_to_soc).publish_state(100);
          // <=60s entities: show unknown until first regular poll.
          id(marstek_battery_power).publish_state(NAN);
          id(marstek_ac_power).publish_state(NAN);
          id(marstek_max_cell_voltage).publish_state(NAN);
          id(marstek_min_cell_voltage).publish_state(NAN);
          id(marstek_forcible_charge_power).publish_state(NAN);
          id(marstek_forcible_discharge_power).publish_state(NAN);
          id(marstek_max_charge_power).publish_state(NAN);
          id(marstek_max_discharge_power).publish_state(NAN);
      # >60s entities: preload all slow register ranges once shortly after boot.
      - delay: 5s
      - lambda: |-
          esphome::modbus_controller::ModbusController *controller = id(mt);
          auto queue_read = [&](uint16_t start_address, uint16_t register_count) {
            auto cmd = esphome::modbus_controller::ModbusCommandItem::create_read_command(
                controller,
                esphome::modbus::ModbusRegisterType::HOLDING,
                start_address,
                register_count);
            controller->queue_command(cmd);
          };

          queue_read(${addr_ems_version}, 5);                // 30200..30204 (EMS/VMS/BMS)
          queue_read(${addr_wifi_status}, 5);                // 30300..30304 (WiFi/BT/Cloud/WiFi dBm/MAC)
          queue_read(${addr_comm_module_firmware}, 6);       // 30350..30355
          queue_read(${addr_device_name}, 10);               // 31000..31009
          queue_read(${addr_battery_total_energy}, 1);       // 32105
          queue_read(${addr_monthly_charging_energy}, 4);    // 33008..33011
          queue_read(${addr_battery_cycle_count}, 1);        // 34003
          queue_read(${addr_internal_temp}, 3);              // 35000..35002
          queue_read(${addr_max_cell_temp}, 2);              // 35010..35011
          queue_read(${addr_charge_current_limit}, 2);       // 35111..35112
          queue_read(${addr_max_cell_voltage}, 2);           // 37007..37008
          queue_read(${addr_modbus_address_register}, 1);    // 41100

esp32:
  board: ${esp32_board}
  cpu_frequency: ${cpu_frequency}
  flash_size: ${flash_size}
  framework:
    type: esp-idf

# Enable logging
logger:
  level: ${logger_default_level}

debug:
  update_interval: ${debug_update_interval}

# Enable Home Assistant API
api:
  encryption:
    key: ${api_encryption_key}

ota:
  - platform: esphome
    password: ${ota_password}
    on_begin:
      - lambda: |-
          id(ota_active) = true;
      - select.set:
          id: "marstek_forcible_chargedischarge"
          option: "Standby"
      - light.turn_on:
          id: status_led
          red: 0%
          green: 100%
          blue: 100%
          brightness: !lambda "return id(led_brightness).state / 100.0;"
          effect: "Fast OTA Pulse"
    on_end:
      - lambda: |-
          id(ota_active) = false;
      - script.execute: apply_status_led_from_status
    on_error:
      - lambda: |-
          id(ota_active) = false;
      - script.execute: apply_status_led_from_status
  - platform: web_server  
    on_begin:
      - lambda: |-
          id(ota_active) = true;
      - select.set:
          id: "marstek_forcible_chargedischarge"
          option: "Standby"
      - light.turn_on:
          id: status_led
          red: 0%
          green: 100%
          blue: 100%
          brightness: !lambda "return id(led_brightness).state / 100.0;"
          effect: "Fast OTA Pulse"
    on_end:
      - lambda: |-
          id(ota_active) = false;
      - script.execute: apply_status_led_from_status
    on_error:
      - lambda: |-
          id(ota_active) = false;
      - script.execute: apply_status_led_from_status

# -----------------------------------------------------------------------------
# Wi-Fi mode is active by default.
# If you want to use a W5500 module instead, keep the `ethernet:` example below
# and comment out these Wi-Fi-specific sections:
# - `wifi:`
# - `captive_portal:`
# - `improv_serial:`
# - the `text_sensor` entry with `platform: wifi_info`
# - the `sensor` entries `platform: wifi_signal` and the following `platform: copy`
#
# Optional W5500 Ethernet mode example:
# ethernet:
#   type: W5500
#   clk_pin: ${w5500_clk_pin}
#   mosi_pin: ${w5500_mosi_pin}
#   miso_pin: ${w5500_miso_pin}
#   cs_pin: ${w5500_cs_pin}
#   interrupt_pin: ${w5500_interrupt_pin}
#   reset_pin: ${w5500_reset_pin}
#   clock_speed: ${w5500_clock_speed}
#   # Optional:
#   # use_address: ${device_name}.local
#   # manual_ip:
#   #   static_ip: 192.168.178.60
#   #   gateway: 192.168.178.1
#   #   subnet: 255.255.255.0
# -----------------------------------------------------------------------------
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: ${wifi_fallback_ssid}
    password: ${wifi_fallback_password}

# Wi-Fi captive portal fallback is only relevant when Wi-Fi mode is enabled.
captive_portal:

# Improv over serial is only useful for Wi-Fi provisioning.
improv_serial:

# Time synchronization
time:
  - platform: sntp
    id: sntp_time
    timezone: ${timezone}
    servers:
      - ${ntp_server_primary}
      - ${ntp_server_secondary}
      - ${ntp_server_tertiary}

web_server:
  port: ${webserver_port}
  version: ${webserver_version}
  include_internal: ${webserver_include_internal}
#  ota: False
  local: ${webserver_local}
  auth:
    username: ${webserver_auth_username}
    password: ${webserver_auth_password}
  sorting_groups:
    - id: Info
      name: "Info"
      sorting_weight: -40
    - id: Control
      name: "Control"
      sorting_weight: -30
    - id: ChargeDischarge
      name: "Charge / Discharge"
      sorting_weight: -29
    - id: Versions
      name: "Versions"
      sorting_weight: -27
    - id: ConnectionsESP
      name: "Connections (ESP)"
      sorting_weight: -26
    - id: ConnectionsBattery
      name: "Connections (Battery)"
      sorting_weight: -25
    - id: AC
      name: "AC"
      sorting_weight: -24
    - id: DC
      name: "DC"
      sorting_weight: -23
    - id: Scheduler
      name: "Scheduler"
      sorting_weight: -22
    - id: Temperature
      name: "Temperature"
      sorting_weight: -21
    - id: Status
      name: "Status"
      sorting_weight: -20
    - id: Diagnostic
      name: "Diagnostic"
      sorting_weight: -10

# Set pins required for LilyGo T-CAN485 board
output:
  - platform: gpio
    id: ENABLE_PIN # Enable the chip
    pin:
      number: ${rs485_enable_pin}
      inverted: ${rs485_enable_inverted}

  - platform: gpio
    id: SE_PIN # Enable autodirection
    pin:
      number: ${rs485_autodir_pin}
      inverted: ${rs485_autodir_inverted}

  - platform: gpio
    id: ENABLE_5V_PIN # Enable 5V pin for RS485 chip
    pin:
      number: ${rs485_5v_enable_pin}
      inverted: ${rs485_5v_enable_inverted}

# Configure UART
uart:
  - id: mod_bus
    rx_pin: ${uart_rx_pin}
    tx_pin: ${uart_tx_pin}
    baud_rate: ${uart_baud_rate}
    data_bits: ${uart_data_bits}
    stop_bits: ${uart_stop_bits}
    parity: ${uart_parity}

modbus:
  - uart_id: mod_bus
    id: modbus1
    send_wait_time: ${modbus_send_wait_time}

modbus_controller:
  - id: mt
    address: ${modbus_address}
    modbus_id: modbus1
    command_throttle: ${modbus_command_throttle}
    update_interval: ${modbus_update_interval}

globals:
  - id: startup_slow_preload_runs
    type: int
    restore_value: no
    initial_value: '0'
  - id: ota_active
    type: bool
    restore_value: no
    initial_value: 'false'

# Text sensors
text_sensor:
  - platform: modbus_controller
    name: "Battery Device Name"
    icon: mdi:rename-outline
    id: battery_device_name
    modbus_controller_id: mt
    register_type: holding
    address: ${addr_device_name}
    register_count: 10
    response_size: 20
    skip_updates: ${skip_updates_low_priority}
    entity_category: diagnostic
    web_server:
      sorting_group_id: ConnectionsBattery
      sorting_weight: 7

  - platform: template
    name: "BMS Version"
    id: bms_version_text
    icon: mdi:factory
    update_interval: never  # updates only when sensor triggers
