###############################################################################
# LED
###############################################################################
light:
  - platform: esp32_rmt_led_strip
    rgb_order: ${status_led_rgb_order}
    chipset: ${status_led_chipset}
    pin: ${status_led_pin}
    num_leds: ${status_led_num_leds}
    name: ${status_led_name}
    id: status_led
    disabled_by_default: true
    effects:
      - pulse:
          name: Fast OTA Pulse
          transition_length: 250ms
          update_interval: 500ms
          min_brightness: 10%
          max_brightness: 100%

script:
  - id: apply_status_led_from_status
    then:
      - lambda: |-
          ESP_LOGD("status", "Modbus: %.0f, API: %s", id(modbus_status).state, id(esp_api_status).state ? "connected" : "disconnected");
      - if:
          condition:
            lambda: |-
              return !isnan(id(modbus_status).state) && id(esp_api_status).state;
          then:
            - light.turn_on:
                id: status_led
                red: 0%
                green: 100%  # Green = Modbus OK and network/API connected
                blue: 0%
                brightness: !lambda "return id(led_brightness).state / 100.0;"
          else:
            - if:
                condition:
                  lambda: |-
                    return isnan(id(modbus_status).state) && !id(esp_api_status).state;
                then:
                  - light.turn_on:
                      id: status_led
                      red: 100%  # Purple = Modbus and network/API failed
                      green: 0%
                      blue: 100%
                      brightness: !lambda "return id(led_brightness).state / 100.0;"
                else:
                  - if:
                      condition:
                        lambda: |-
                          return !id(esp_api_status).state;
                      then:
                        - light.turn_on:
                            id: status_led
                            red: 0%
                            green: 0%
                            blue: 100%  # Blue = network/API disconnected
                            brightness: !lambda "return id(led_brightness).state / 100.0;"
                      else:
                        - light.turn_on:
                            id: status_led
                            red: 100%  # Red = Modbus error, network/API connected
                            green: 0%
                            blue: 0%
                            brightness: !lambda "return id(led_brightness).state / 100.0;"

interval:
  - interval: 10s
    then:
      - lambda: |-
          // Retry slow-range preload during early startup to avoid timing races.
          if (id(startup_slow_preload_runs) >= 6) {
            return;
          }
          esphome::modbus_controller::ModbusController *controller = id(mt);
          auto queue_read = [&](uint16_t start_address, uint16_t register_count) {
            auto cmd = esphome::modbus_controller::ModbusCommandItem::create_read_command(
                controller,
                esphome::modbus::ModbusRegisterType::HOLDING,
                start_address,
                register_count);
            controller->queue_command(cmd);
          };
          queue_read(${addr_ems_version}, 5);
          queue_read(${addr_wifi_status}, 5);
          queue_read(${addr_comm_module_firmware}, 6);
          queue_read(${addr_device_name}, 10);
          queue_read(${addr_battery_total_energy}, 1);
          queue_read(${addr_monthly_charging_energy}, 4);
          queue_read(${addr_battery_cycle_count}, 1);
          queue_read(${addr_internal_temp}, 3);
          queue_read(${addr_max_cell_temp}, 2);
          queue_read(${addr_charge_current_limit}, 2);
          queue_read(${addr_max_cell_voltage}, 2);
          queue_read(${addr_modbus_address_register}, 1);
          id(startup_slow_preload_runs) += 1;

  - interval: ${status_check_interval}
    then:
      - if:
          condition:
            and:
              - switch.is_off: manual_led_control
              - lambda: |-
                  return !id(ota_active);
          then:
            - script.execute: apply_status_led_from_status
    


